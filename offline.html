<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaDeskOnline · Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0a0f1e;color:#e8f2ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.icon{font-size:3rem;margin-bottom:20px}
h1{font-size:1.4rem;margin-bottom:10px}
p{font-size:.85rem;color:#7898bc;line-height:1.6;max-width:280px;margin:0 auto 28px}
button{padding:12px 28px;background:#0066ff;color:#fff;border:none;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer}
.status{font-size:.7rem;color:#4a6a8a;margin-top:16px}
</style>
</head>
<body>
<div class="icon">📡</div>
<h1>You're Offline</h1>
<p>NovaDeskOnline needs a connection. Check your internet and try again.</p>
<button onclick="location.reload()">↺ Try Again</button>
<div class="status" id="st">Checking connection…</div>
<script>
window.addEventListener('online', ()=>location.reload());
setInterval(()=>{
  document.getElementById('st').textContent = navigator.onLine ? 'Connection found — reloading…' : 'Still offline…';
  if(navigator.onLine) setTimeout(()=>location.reload(), 600);
}, 2000);
</script>
</body>
</html>
